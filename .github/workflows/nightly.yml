name: Debug build

# Builds the debug APK on every push to main (app/ changes), nightly at
# 02:00 UTC, or on demand from the Actions tab. The APK is uploaded as a
# workflow artifact (Actions tab, kept 30 days).

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC nightly
  workflow_dispatch: {}
  push:
    branches:
      - main
      - feature/six-phase-upgrade-v2
    paths:
      - "app/**"
      - ".github/workflows/nightly.yml"

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AH_GITHUB_CLIENT_ID: ${{ secrets.AH_GITHUB_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      # The runner image no longer ships the NDK version pinned in
      # app/build.gradle.kts, and AGP refuses to configure without it.
      - name: Install pinned NDK
        run: "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;27.2.12479018'"

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stamp APK with date + commit
        id: apk
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          SHA=$(git rev-parse --short HEAD)
          NAME="AndroidHarness-${STAMP}-${SHA}-debug.apk"
          mkdir dist && cp app/build/outputs/apk/debug/app-debug.apk "dist/${NAME}"
          cp app/build/outputs/gpuRuntime/debug/*.gz dist/
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish matching optional GPU packages
        env:
          GH_TOKEN: ${{ secrets.GPU_RUNTIME_PUBLISH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'GPU packages are included in the build artifact. Publish them from AH-GPU-Runtime, or configure GPU_RUNTIME_PUBLISH_TOKEN for automatic cross-repository uploads.'
            exit 0
          fi
          if ! gh release view 1 --repo Sanuu7/AH-GPU-Runtime >/dev/null 2>&1; then
            gh release create 1 --repo Sanuu7/AH-GPU-Runtime --title 'Optional local GPU runtime' --notes 'Verified GPU packages downloaded by AndroidHarness when requested.' --latest=false
          fi
          gh release upload 1 --repo Sanuu7/AH-GPU-Runtime app/build/outputs/gpuRuntime/debug/*.gz --clobber

      - name: Upload artifact (Actions tab, kept 30 days)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*
          retention-days: 30
