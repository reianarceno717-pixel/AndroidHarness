name: Capture AndroidHarness native UI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout shell branch
        uses: actions/checkout@v4
        with:
          ref: work/six-phase-upgrade

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Android NDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y glslc

      - name: Build original AndroidHarness debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Launch app in Android emulator and capture native UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.androidharness.app.godai
            adb shell monkey -p com.androidharness.app.godai -c android.intent.category.LAUNCHER 1
            sleep 25
            mkdir -p artifacts/native-ui
            adb exec-out screencap -p > artifacts/native-ui/androidharness-home.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml artifacts/native-ui/window.xml
            adb shell dumpsys activity activities > artifacts/native-ui/activities.txt
            adb logcat -d -t 5000 > artifacts/native-ui/logcat.txt

      - name: Upload real emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidharness-native-ui-capture
          path: artifacts/native-ui/
          if-no-files-found: warn
          retention-days: 7
